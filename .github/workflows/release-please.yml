name: Release Please

# Maintains an open "chore: release X.Y.Z" pull request that accumulates every
# merge to main — bumping the proposed version from conventional-commit
# prefixes and appending the CHANGELOG entry. When the release PR is merged the
# tag is cut and its push fires release.yml, which publishes to PyPI.
#
# The App token (not GITHUB_TOKEN) is load-bearing: GitHub suppresses workflow
# runs for events generated with GITHUB_TOKEN, so a tag cut with it never
# fires release.yml and nothing reaches PyPI. Same for auto-merge: armed with
# GITHUB_TOKEN, GitHub attributes the merge to the bot and downstream
# workflows never run. The willow-ci GitHub App must be installed on the org
# with Contents: read/write and Pull requests: read/write, and the org must
# carry vars.WILLOW_CI_APP_ID and secrets.WILLOW_CI_PRIVATE_KEY.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint a willow-ci installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILLOW_CI_APP_ID }}
          private-key: ${{ secrets.WILLOW_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Arm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                       | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR — nothing releasable since the last tag."
            exit 0
          fi
          if ! out=$(gh pr merge --auto --merge "$pr" --repo "$REPO" 2>&1); then
            echo "::warning::could not arm auto-merge on PR #${pr}: ${out}"
            echo "::warning::the release PR is open and must be merged by hand"
          else
            echo "auto-merge armed on PR #${pr}"
          fi
