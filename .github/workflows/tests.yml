name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # willow-mcp needs Python >=3.11, so the seat extra resolves there only;
      # this makes tests/test_seat_extra.py's resolution guards real.
      - name: Install seat extra
        if: matrix.python-version != '3.10'
        run: pip install -e ".[dev,seat]"

      - name: Run tests
        run: python -m pytest tests/ -q

  # The one script (one-script/, moved from willows-grove). It reads its law
  # from willows-grove, so both repos are checked out side by side, the same
  # layout the operator's box has; the tests read the real constitution.
  one-script:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: willow-bot

      # A change that spans repos rides one branch name in each: take
      # willow-memory/willows-grove's branch of this PR's name when it has one, else master.
      - name: Which willows-grove
        id: grove_ref
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/willow-memory/willows-grove "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/willows-grove
          ref: ${{ steps.grove_ref.outputs.ref }}
          path: willows-grove

      # The one stream's parity and seam tests (flatten F1) drive the-table's
      # games; without safe-app-store beside, they skip.
      # A change that spans repos rides one branch name in each: take
      # rudi193-cmd/safe-app-store's branch of this PR's name when it has one, else master.
      - name: Which safe-app-store
        id: store_ref
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/rudi193-cmd/safe-app-store "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: rudi193-cmd/safe-app-store
          ref: ${{ steps.store_ref.outputs.ref }}
          path: safe-app-store

      # The reach's parity test (flatten-2 F6.5) holds every consumer's copy of
      # reach_bootstrap.py to the template, so every consumer is beside.
      # A change that spans repos rides one branch name in each.
      - name: Which willow-mcp
        id: mcp_ref
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/willow-memory/willow-mcp "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/willow-mcp
          ref: ${{ steps.mcp_ref.outputs.ref }}
          path: willow-mcp

      - name: Which ratatosk
        id: rat_ref
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/willow-memory/ratatosk "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: willow-memory/ratatosk
          ref: ${{ steps.rat_ref.outputs.ref }}
          path: ratatosk

      # Nestor beside the bot, so onescript/tests/test_nestor_parity.py holds the
      # one script to Nestor's frozen encodings (flatten-2 LE7; the operator:
      # "1 add the step"). Read only: nothing here installs or runs Nestor.
      - name: Which nestor
        id: nestor_ref
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Die-Namic-Systems/Nestor "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: Die-Namic-Systems/Nestor
          ref: ${{ steps.nestor_ref.outputs.ref }}
          path: nestor

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install pytest cryptography ruff==0.16.7 "chess>=1.10" "dice>=4.0.0"

      - name: Lint
        working-directory: willow-bot/one-script
        run: ruff check . && ruff format --check .

      - name: Run the one script's tests
        working-directory: willow-bot/one-script
        run: python -m pytest -q -p no:cacheprovider onescript/tests

      - name: Run prompt.py's tests without pytest
        working-directory: willow-bot/one-script
        run: python foundation/run_prompt_tests.py

  test:
    needs: [test-matrix, one-script]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every matrix leg actually succeeded
        if: ${{ needs.test-matrix.result != 'success' || needs.one-script.result != 'success' }}
        run: |
          echo "::error::test-matrix: ${{ needs.test-matrix.result }}, one-script: ${{ needs.one-script.result }}"
          exit 1
      - run: echo "all matrix legs green"
