[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willow-bot"
version = "0.9.1"
description = "Willow GitHub App webhook + orchestrator-feeding steward (propose-only deposits)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sean Campbell" }]
keywords = ["willow", "github-app", "webhook", "steward", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "PyJWT==2.10.1",
    "cryptography>=44.0.0",
    "requests==2.32.3",
]

[project.optional-dependencies]
# Grove Loki semantic path needs Nestor; install separately (PyPI forbids direct URL deps):
#   pip install "nestor @ git+https://github.com/Die-Namic-Systems/Nestor@master"
mcp = ["mcp>=1.0,<3"]
# `httpx` is what `starlette.testclient.TestClient` uses for its in-process
# transport; the newer starlette imports `httpx2 as httpx` first and falls
# back to `httpx`, so either one satisfies the requirement. Without it the
# webhook boundary tests raise `RuntimeError: … requires the httpx2 package`
# — they need TestClient to exercise `bot.py`'s FastAPI handler end-to-end.
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
willow-bot = "willow_bot.cli:webhook_main"
willow-bot-steward = "willow_bot.cli:steward_main"
willow-bot-deterministic = "willow_bot.deterministic.cli:main"

[project.urls]
Homepage = "https://github.com/willow-memory/willow-bot"
Repository = "https://github.com/willow-memory/willow-bot"
Issues = "https://github.com/willow-memory/willow-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["willow_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
