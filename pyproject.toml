[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willow-bot"
version = "1.25.0"
description = "Willow GitHub App webhook + orchestrator-feeding steward (propose-only deposits)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sean Campbell" }]
keywords = ["willow", "github-app", "webhook", "steward", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "PyJWT==2.15.1",
    "cryptography>=44.0.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
# Grove Loki semantic path needs Nestor; install separately (PyPI forbids direct URL deps):
#   pip install "nestor @ git+https://github.com/Die-Namic-Systems/Nestor@master"
mcp = ["mcp>=1.0,<3"]
# `httpx` is what `starlette.testclient.TestClient` uses for its in-process
# transport; the newer starlette imports `httpx2 as httpx` first and falls
# back to `httpx`, so either one satisfies the requirement. Without it the
# webhook boundary tests raise `RuntimeError: … requires the httpx2 package`
# — they need TestClient to exercise `bot.py`'s FastAPI handler end-to-end.
# `ruff` is pinned exactly to the fleet's CI pin: the one script's toolchain
# gate checks the bot venv's ruff against it (D2: the venvs live in the bot).
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.7"]
# The pile's rung 3 (`pile.wordllama_embed`): a static embedder, run from the
# model files its package bundles, never downloaded. The per-prompt hook fuses
# it with the words' rank when `ONESCRIPT_EMBED` names its cache dir.
#   wordllama: 0.4 is the release the rung and the hook were verified against
#   (its bundled `l2_supercat_256`); capped at the next minor, whose file
#   layout the rung's tokenizer copy depends on.
embed = ["wordllama>=0.4,<0.5"]
# The one stream's table tests (one-script/onescript/tests/test_stream.py,
# flatten F1) drive the-table's games from safe-app-store beside the bot.
#   chess: python-chess, which game-lab's sims/baseline_core.py imports at the
#   top; the checkers and backgammon adapters reuse its rules. Floor 1.10 is
#   the-table's own requirements.txt floor.
#   dice: the dice-notation library the-table's requirements.txt names
#   (aetheris5e/dice5e.py's authority). Floor 4.0.0, the same file's.
table = ["chess>=1.10", "dice>=4.0.0"]
# The grove CLI seat's runtime (D2: the venvs live in the bot). The seat's
# close-out deposit lazy-imports `willow_mcp` (onescript_deposit, db.Store) and
# its flowering turns shell out to the `ratatosk` console script, so a
# provisioned bot venv must carry both: `pip install -e ".[seat]"`.
# docs/design/fleet-versioning.md Rule 1 (every pin carries its why):
#   willow-mcp: floor 2.96.0 is the release the seat's deposit path was
#   verified against; capped at the next major. Both are PyPI packages (no
#   direct-URL dep). No cycle: willow-mcp's deps do not name willow-bot (the
#   arrows point into willow-mcp), and tests/test_seat_extra.py guards that.
#   willow-ratatosk: willow-mcp already pulls it transitively, but it is listed
#   here because the seat needs its `ratatosk` console script on the venv bin
#   and must not lose it if willow-mcp ever drops the dependency. Floor 1.16.0:
#   the seat's flowering turns run `ratatosk --onescript --class flowering`,
#   and `--class` first ships in 1.16.0 (1.7.x has neither flag; --onescript
#   arrives in 1.13.0). Capped at the next major.
# willow-mcp requires Python >=3.11, so this extra does not resolve on 3.10.
#   willow-mcp[nestor]: the deposit's draft goes through decision_propose, which
#   returns `nestor_unavailable` unless the Nestor engine is importable. The
#   `nestor` extra of willow-mcp brings `nestor-meaning` (import name `nestor`),
#   so the seat names the extra rather than pinning nestor-meaning itself; its
#   floor/cap live in willow-mcp (gap 672dba733856).
seat = ["willow-mcp[nestor]>=2.96.0,<3.0.0", "willow-ratatosk>=1.16.0,<2.0.0"]

[project.scripts]
willow-bot = "willow_bot.cli:webhook_main"
willow-bot-steward = "willow_bot.cli:steward_main"
willow-bot-contribute = "willow_bot.contribute:main"
willow-bot-deterministic = "willow_bot.deterministic.cli:main"

[project.urls]
Homepage = "https://github.com/willow-memory/willow-bot"
Repository = "https://github.com/willow-memory/willow-bot"
Issues = "https://github.com/willow-memory/willow-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["willow_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
